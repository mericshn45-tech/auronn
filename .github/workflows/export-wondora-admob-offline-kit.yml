name: Export Wondora AdMob Offline Kit

on:
  push:
    branches: [ "wondora-android-build" ]
    paths:
      - ".github/workflows/export-wondora-admob-offline-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if [ ! -f "$SDK/platforms/android-36/android.jar" ]; then yes | "$SDKMANAGER" "platforms;android-36" || true; fi
          if [ ! -x "$SDK/build-tools/36.0.0/aapt2" ]; then yes | "$SDKMANAGER" "build-tools;36.0.0" || true; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -f "$SDK/platforms/android-36/android.jar"
          test -x "$SDK/build-tools/36.0.0/aapt2"

      - name: Resolve AGP, AdMob and UMP dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/wondora-deps/app/src/main/java/com/auronn/deps
          cat > /tmp/wondora-deps/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='WondoraDeps'
          include ':app'
          EOF
          cat > /tmp/wondora-deps/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.10.1' apply false }
          EOF
          cat > /tmp/wondora-deps/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          cat > /tmp/wondora-deps/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.auronn.deps'; compileSdk 36
            defaultConfig { applicationId 'com.auronn.deps'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'com.google.android.gms:play-services-ads:25.5.0'
            implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
          }
          EOF
          cat > /tmp/wondora-deps/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar"><meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > /tmp/wondora-deps/app/src/main/java/com/auronn/deps/MainActivity.java <<'EOF'
          package com.auronn.deps; public class MainActivity extends android.app.Activity {}
          EOF
          cd /tmp/wondora-deps
          gradle --no-daemon :app:assembleDebug

      - name: Pack offline kit
        shell: bash
        run: |
          set -euxo pipefail
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p offline/gradle offline/gradle-user-home/caches offline/android-sdk/platforms offline/android-sdk/build-tools offline/android-sdk/licenses
          cp -a "$GRADLE_HOME" offline/gradle/gradle-8.11.1
          cp -a "$HOME/.gradle/caches/modules-2" offline/gradle-user-home/caches/
          cp -a "$SDK/platforms/android-36" offline/android-sdk/platforms/
          cp -a "$SDK/build-tools/36.0.0" offline/android-sdk/build-tools/
          if [ -d "$SDK/licenses" ]; then cp -a "$SDK/licenses/." offline/android-sdk/licenses/; fi
          du -sh offline/* offline/gradle-user-home/caches/modules-2
          tar -C offline -czf wondora-admob-offline-kit.tar.gz .
          sha256sum wondora-admob-offline-kit.tar.gz > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wondora-admob-offline-kit
          path: |
            wondora-admob-offline-kit.tar.gz
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
